<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Vibrant Brand Gradient (Indigo -> Electric Violet -> Fuchsia) -->
    <linearGradient id="brandBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5" />
      <stop offset="0.55" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#db2777" />
    </linearGradient>

    <!-- Golden AI Magic Sparkle Gradient -->
    <linearGradient id="starGrad" x1="36" y1="4" x2="56" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef08a" />
      <stop offset="0.45" stop-color="#facc15" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>

    <!-- Subtle Drop Shadow for the front slide -->
    <filter id="slideShadow" x="6" y="15" width="48" height="36" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>

    <!-- Sparkle Glow -->
    <filter id="starGlow" x="30" y="0" width="32" height="32" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#fbbf24" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Squircle Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#brandBg)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.28)" stroke-width="1.5" />

  <!-- 2. Back Deck Slide (Dimensional Depth) -->
  <rect x="20" y="12" width="32" height="22" rx="4.5" fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" />

  <!-- 3. Front Presentation Slide (Crisp White Card) -->
  <g filter="url(#slideShadow)">
    <rect x="11" y="19" width="37" height="26" rx="5" fill="#ffffff" />
  </g>

  <!-- 4. Slide Content Lines (Presentation Layout) -->
  <rect x="15" y="24" width="14" height="3.5" rx="1.75" fill="#4f46e5" />
  <rect x="15" y="30" width="9" height="2.5" rx="1.25" fill="#93c5fd" />
  
  <!-- Presentation Chart / Metric blocks -->
  <rect x="15" y="35" width="5" height="4" rx="1" fill="#c084fc" />
  <rect x="22" y="34" width="5" height="5" rx="1" fill="#818cf8" />
  <rect x="29" y="32" width="5" height="7" rx="1" fill="#38bdf8" />

  <!-- 5. Primary AI Magic Star (Gemini 4-point Sparkle) -->
  <g filter="url(#starGlow)">
    <path d="M 45 4 C 45 10.5 48.5 14.5 55 14.5 C 48.5 14.5 45 18.5 45 25 C 45 18.5 41.5 14.5 35 14.5 C 41.5 14.5 45 10.5 45 4 Z" fill="url(#starGrad)" />
    <circle cx="45" cy="14.5" r="1.5" fill="#ffffff" />
  </g>

  <!-- 6. Secondary Accent AI Star -->
  <path d="M 50 27 C 50 29 51 30 53 30 C 51 30 50 31 50 33 C 50 31 49 30 47 30 C 49 30 50 29 50 27 Z" fill="#fef08a" />
</svg>
